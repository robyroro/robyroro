<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Vind-Gardoș Robert</title>
  <desc id="description">CEO @ Recompensated · Founder @ STRAT Agency · Open-source security, OSINT, and automation</desc>

  <style>
    .rise { animation: rise 0.9s cubic-bezier(.2, .7, .2, 1) both; }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .85s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid { animation: drift 8s linear infinite; }
    @keyframes drift { to { transform: translate(-28px, -28px); } }

    .blob-a { animation: float-a 11s ease-in-out infinite alternate; }
    .blob-b { animation: float-b 14s ease-in-out infinite alternate; }
    @keyframes float-a { to { transform: translate(-160px, 50px); } }
    @keyframes float-b { to { transform: translate(180px, -40px); } }

    .flow { stroke-dasharray: 16 220; animation: flow 3s linear infinite; }
    .flow.slow { animation-duration: 4.2s; }
    @keyframes flow {
      from { stroke-dashoffset: 236; }
      to { stroke-dashoffset: 0; }
    }

    .spin { transform-origin: 1010px 150px; animation: spin 24s linear infinite; }
    .spin-rev { transform-origin: 1010px 150px; animation: spin 36s linear infinite reverse; }
    .sweep { transform-origin: 1010px 150px; animation: spin 4.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bar { transform-origin: 80px 0; animation: grow 1.1s 1s cubic-bezier(.2, .7, .2, 1) both; }
    .bar.b2 { transform-origin: 298px 0; animation-delay: 1.25s; }
    .bar.b3 { transform-origin: 382px 0; animation-delay: 1.45s; }
    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d19"/>
      <stop offset="0.55" stop-color="#0d1f36"/>
      <stop offset="1" stop-color="#123447"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#9bd7d0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="name-shine" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.42" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="0.58" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f8fafc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-700 0; 1000 0; 1000 0" keyTimes="0; 0.55; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep-fill" x1="1010" y1="40" x2="1085" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <filter id="neon" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Background, drifting glows, and moving grid -->
    <rect width="1200" height="300" fill="url(#background)"/>
    <g class="blob-a"><ellipse cx="930" cy="70" rx="420" ry="240" fill="url(#glow-teal)"/></g>
    <g class="blob-b"><ellipse cx="220" cy="260" rx="380" ry="200" fill="url(#glow-sky)"/></g>
    <rect class="grid" width="1260" height="360" fill="url(#grid)"/>

    <!-- Twinkling particles -->
    <g fill="#99f6e4">
      <circle cx="610" cy="46" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="702" cy="96" r="1.2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="210" r="1.8"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="455" cy="38" r="1.3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="140" r="1.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="272" r="1.4"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="128" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Circuit traces flowing into the radar -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#5eead4" stroke-opacity="0.35" stroke-width="2">
        <path d="M1188 52 H1140 L1105 87"/>
        <path d="M1188 250 H1130 L1098 218"/>
        <path d="M850 272 H925 L952 244"/>
        <path d="M842 30 H912 L940 62"/>
      </g>
      <g stroke="#a7f3d0" stroke-width="3" filter="url(#neon)">
        <path class="flow" d="M1188 52 H1140 L1105 87"/>
        <path class="flow slow" d="M1188 250 H1130 L1098 218"/>
        <path class="flow" d="M850 272 H925 L952 244" style="animation-delay: -1.4s"/>
        <path class="flow slow" d="M842 30 H912 L940 62" style="animation-delay: -2.1s"/>
      </g>
    </g>
    <g fill="#5eead4">
      <circle cx="1188" cy="52" r="3.5"/>
      <circle cx="1188" cy="250" r="3.5"/>
      <circle cx="850" cy="272" r="3.5"/>
      <circle cx="842" cy="30" r="3.5"/>
    </g>
    <g fill="none" stroke="#5eead4" stroke-width="1.5">
      <circle cx="850" cy="272" r="4">
        <animate attributeName="r" values="4;12" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="842" cy="30" r="4">
        <animate attributeName="r" values="4;12" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Radar -->
    <g fill="none" stroke="#5eead4">
      <circle cx="1010" cy="150" r="110" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="1010" cy="150" r="78" stroke-opacity="0.16"/>
      <circle cx="1010" cy="150" r="46" stroke-opacity="0.14"/>
      <path d="M900 150 H1120 M1010 40 V260" stroke-opacity="0.1"/>
      <circle class="spin" cx="1010" cy="150" r="94" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 14"/>
      <circle class="spin-rev" cx="1010" cy="150" r="62" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="40 22 6 22"/>
    </g>
    <path class="sweep" d="M1010 150 L1010 40 A110 110 0 0 1 1087.78 72.22 Z" fill="url(#sweep-fill)"/>
    <line class="sweep" x1="1010" y1="150" x2="1087.78" y2="72.22" stroke="#5eead4" stroke-opacity="0.8" stroke-width="1.5"/>
    <g fill="#5eead4" filter="url(#neon)">
      <circle cx="972" cy="108" r="3.5"><animate attributeName="opacity" values="1;0.15;1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1062" cy="186" r="3"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1046" cy="96" r="2.5" fill="#38bdf8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="958" cy="198" r="3" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="150" r="5"/>
    </g>
    <circle cx="1010" cy="150" r="6" fill="none" stroke="#5eead4" stroke-width="1.5">
      <animate attributeName="r" values="6;22" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Text -->
    <g font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <g class="rise d1">
        <text x="82" y="82" fill="#5eead4" font-family="Consolas, SFMono-Regular, Menlo, 'Courier New', monospace" font-size="18" textLength="90" lengthAdjust="spacingAndGlyphs">$ whoami</text>
        <rect class="caret" x="180" y="67" width="10" height="18" rx="1.5" fill="#5eead4"/>
      </g>
      <g class="rise d2" filter="url(#shadow)">
        <text x="78" y="148" fill="url(#name-shine)" font-size="62" font-weight="700" letter-spacing="0.5">Vind-Gardoș Robert</text>
      </g>
      <g class="rise d3">
        <text x="82" y="192" fill="#99f6e4" font-size="20" font-weight="600" letter-spacing="2.5" xml:space="preserve">CEO @ RECOMPENSATED  <tspan fill="#38bdf8">•</tspan>  FOUNDER @ STRAT AGENCY</text>
      </g>
      <g class="rise d4">
        <text x="82" y="226" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="3.2" xml:space="preserve">OPEN-SOURCE SECURITY  •  OSINT  •  AUTOMATION  •  GROWTH</text>
      </g>
    </g>
    <rect class="bar" x="80" y="250" width="210" height="4" rx="2" fill="#2dd4bf"/>
    <rect class="bar b2" x="298" y="250" width="76" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
    <rect class="bar b3" x="382" y="250" width="28" height="4" rx="2" fill="#a78bfa" opacity="0.8"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#5eead4" stroke-opacity="0.18" stroke-width="2"/>
</svg>
